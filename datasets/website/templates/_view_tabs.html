{% macro view_tabs(people_route, institutions_route, recent_route, current) %}
<nav class="view-tabs" aria-label="Views">
  <a href="{{ href(people_route) }}"{% if current == "people" %} aria-current="page"{% endif %}>People</a>
  <span aria-hidden="true">|</span>
  <a href="{{ href(institutions_route) }}"{% if current == "institutions" %} aria-current="page"{% endif %}>Institutions</a>
  <span aria-hidden="true">|</span>
  <a href="{{ href(recent_route) }}"{% if current == "recent" %} aria-current="page"{% endif %}>Recent</a>
</nav>
{% endmacro %}

{% macro country_tabs(current) %}
<nav class="view-tabs" aria-label="Country views">
  {% for label, route in country_views %}
  <a href="{{ href(route) }}"{% if current == label %} aria-current="page"{% endif %}>{{ label }}</a>
  {% endfor %}
  <a href="{{ href(cities_route) }}"{% if current == "Cities" %} aria-current="page"{% endif %}>Cities</a>
  <a href="{{ href(cities_per_capita_route) }}"{% if current == "Cities %" %} aria-current="page"{% endif %}>Cities %</a>
  <a class="tab-alt" href="{{ href(country_affiliations_route) }}"{% if current == "Institutions" %} aria-current="page"{% endif %}>Institutions</a>
</nav>
{% endmacro %}
