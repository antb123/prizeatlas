{% extends "base.html" %}
{% block head %}
  <style>
    .locate { margin: 2rem 0; }
    .locate button {
      min-height: 2.45rem;
      padding: .5rem .75rem;
      border: 1px solid var(--rule);
      border-radius: 2px;
      color: var(--ink);
      background: var(--surface);
      font: inherit;
      font-size: .78rem;
      font-weight: 700;
      cursor: pointer;
      transition: color .15s ease, opacity .15s ease, background .15s ease;
    }
    .locate button:hover { color: var(--accent); background: var(--paper); }
    .locate button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .locate button:disabled { cursor: wait; opacity: .55; }
    #status { min-height: 1.6em; margin: .75rem 0 0; color: var(--muted); }
    .privacy { color: var(--muted); font-size: .875rem; }
    .near-list { margin: 1rem 0 2rem; padding: 0; list-style: none; }
    .near-list > li { padding: 1rem 0; border-top: 1px solid var(--rule); }
    .near-meta { margin: 0 0 .3rem; color: var(--muted); font-size: .8125rem; font-variant-numeric: tabular-nums; }
    .near-name { margin: 0; font-size: 1.0625rem; font-weight: 500; line-height: 1.25; }
    .near-where { margin: .2rem 0 .5rem; color: var(--muted); font-size: .875rem; }
    .near-dot { display: inline-block; width: .55rem; height: .55rem; margin: 0 .3rem; border-radius: 50%; vertical-align: .02rem; }
    .near-dot.birth { background: var(--birth); }
    .near-dot.institution { background: var(--institution); }
    .near-list .rank-units { margin: 0; }
    :root { --birth: #9a6035; --institution: #346d76; }
    @media (prefers-color-scheme: dark) {
      :root { --birth: #d3a06e; --institution: #86b5bc; }
    }
    @media (min-width: 40rem) {
      .near-list > li { display: grid; grid-template-columns: 6.5rem minmax(0, 1fr); column-gap: 1rem; }
      .near-meta { grid-row: 1 / span 3; }
    }
  </style>
{% endblock %}
{% block content %}
  <header class="page-intro">
    <p class="eyebrow">{{ t("nearby.eyebrow") }}</p>
    <h1>{{ t("nearby.heading") }}</h1>
    <p>{{ t("nearby.intro") }}</p>
  </header>

  <section class="locate">
    <button id="locate" type="button">{{ t("nearby.use_location") }}</button>
    <p id="status" role="status"></p>
    <p class="privacy">{{ t("nearby.privacy") }}</p>
  </section>

  <h2 id="near-h" tabindex="-1" hidden>{{ t("nearby.near_you") }}</h2>
  <ol id="near-list" class="near-list"></ol>

  <script id="nearby-data" type="application/json">{{ payload|safe }}</script>
  <script id="nearby-ui" type="application/json">{{ {
    "locale": language.code,
    "map": t("chrome.map"),
    "nearYou": t("nearby.near_you"),
    "closestAnywhere": t("nearby.closest_anywhere"),
    "bornHere": t("nearby.born_here"),
    "workedHere": t("nearby.worked_here"),
    "otherNames": {"one": browser_t("nearby.other_names.one"), "other": browser_t("nearby.other_names.other")},
    "more": {"one": browser_t("nearby.more.one"), "other": browser_t("nearby.more.other")},
    "nothingNearby": browser_t("nearby.nothing_nearby"),
    "nearbyStatus": browser_t("nearby.nearby_status"),
    "fragmentStatus": browser_t("nearby.fragment_status"),
    "browserUnsupported": t("nearby.browser_unsupported"),
    "waiting": t("nearby.waiting"),
    "updateLocation": t("nearby.update_location"),
    "permissionDenied": t("nearby.permission_denied"),
    "positionUnavailable": t("nearby.position_unavailable"),
    "timeout": t("nearby.timeout"),
    "distanceUnderOne": t("nearby.distance_under_one"),
    "distanceDecimal": browser_t("nearby.distance_decimal"),
    "distanceRounded": browser_t("nearby.distance_rounded")
  }|tojson }}</script>
  <script>
    (() => {
      "use strict";
      const button = document.getElementById("locate");
      const status = document.getElementById("status");
      const heading = document.getElementById("near-h");
      const list = document.getElementById("near-list");
      const payload = JSON.parse(document.getElementById("nearby-data").textContent);
      const UI = JSON.parse(document.getElementById("nearby-ui").textContent);
      const number = new Intl.NumberFormat(UI.locale);
      const decimal = new Intl.NumberFormat(UI.locale, {minimumFractionDigits: 1, maximumFractionDigits: 1});
      const coordinate = new Intl.NumberFormat(UI.locale, {minimumFractionDigits: 2, maximumFractionDigits: 2});
      const plural = new Intl.PluralRules(UI.locale);
      let located = false;

      const format = (template, fields) => template.replace(/\{([a-z_]+)\}/g, (match, name) => Object.hasOwn(fields, name) ? String(fields[name]) : match);
      const pluralText = (forms, count, fields = {}) => format(forms[plural.select(count)], {...fields, count});
      const element = (name, className, content) => {
        const node = document.createElement(name);
        if (className) node.className = className;
        if (content !== undefined) node.textContent = content;
        return node;
      };
      const link = (href, content) => {
        const node = document.createElement("a");
        node.href = href;
        node.textContent = content;
        return node;
      };
      const formatDistance = (distance) => {
        if (distance < 1) return UI.distanceUnderOne;
        if (distance < 10) return format(UI.distanceDecimal, {distance: decimal.format(distance)});
        return format(UI.distanceRounded, {distance: number.format(Math.round(distance))});
      };
      const distance = (latitude, longitude, point) => {
        const radians = Math.PI / 180;
        const deltaLatitude = (point[1] - latitude) * radians;
        const deltaLongitude = (point[0] - longitude) * radians;
        const a = Math.sin(deltaLatitude / 2) ** 2 + Math.cos(latitude * radians) * Math.cos(point[1] * radians) * Math.sin(deltaLongitude / 2) ** 2;
        return 2 * 6371 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      };
      const clearResults = () => {
        list.replaceChildren();
        heading.hidden = true;
      };
      const placeItem = (place) => {
        const item = document.createElement("li");
        const meta = element("p", "near-meta");
        meta.append(document.createTextNode(`${formatDistance(place.d)} · `));
        const dot = element("span", `near-dot ${place.k === "b" ? "birth" : "institution"}`);
        dot.setAttribute("aria-hidden", "true");
        meta.append(dot, document.createTextNode(place.k === "b" ? UI.bornHere : UI.workedHere));

        const name = element("p", "near-name");
        const location = `${place.n} (${place.c})`;
        name.append(place.r ? link(place.r, location) : document.createTextNode(place.n));
        item.append(meta, name);

        const whereLabel = place.display_where || place.w;
        if (whereLabel || place.x) {
          const where = element("p", "near-where");
          if (whereLabel) where.append(document.createTextNode(whereLabel));
          if (place.x) {
            if (whereLabel) where.append(document.createTextNode(" · "));
            where.append(document.createTextNode(pluralText(UI.otherNames, place.x)));
          }
          item.append(where);
        }

        const names = place.p.map((index) => payload.people[index]);
        const visible = names.slice(0, 4);
        const people = element("p", "rank-units");
        visible.forEach(([name, route], index) => {
          if (index) people.append(document.createTextNode(", "));
          people.append(route ? link(route, name) : document.createTextNode(name));
        });
        item.append(people);
        const extra = names.length - visible.length;
        if (extra) item.append(element("p", "rank-units-more", pluralText(UI.more, extra)));
        return item;
      };
      const show = (latitude, longitude, fromFragment) => {
        const nearest = payload.places.map((place) => ({...place, d: distance(latitude, longitude, place.g)})).sort((left, right) => left.d - right.d).slice(0, 25);
        if (!nearest.length) return;
        const closest = nearest[0];
        heading.textContent = closest.d > 500 ? UI.closestAnywhere : UI.nearYou;
        heading.hidden = false;
        list.replaceChildren(...nearest.map(placeItem));
        status.textContent = closest.d > 500
          ? format(UI.nothingNearby, {distance: formatDistance(closest.d)})
          : format(UI.nearbyStatus, {count: number.format(nearest.length), distance: formatDistance(nearest.at(-1).d), place: closest.n});
        if (fromFragment) status.append(document.createTextNode(` ${format(UI.fragmentStatus, {latitude: coordinate.format(latitude), longitude: coordinate.format(longitude)})}`));
      };
      const parsedFragment = () => {
        const match = /^#(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)$/.exec(location.hash);
        return match ? [Number(match[1]), Number(match[2])] : null;
      };

      const fragment = parsedFragment();
      if (fragment) show(fragment[0], fragment[1], true);

      if (!window.isSecureContext || !navigator.geolocation) {
        const mapLink = link({{ href(map_route)|tojson }}, UI.map);
        status.replaceChildren(document.createTextNode(`${UI.browserUnsupported} `), mapLink);
        button.disabled = true;
      } else {
        button.addEventListener("click", () => {
          button.disabled = true;
          button.setAttribute("aria-busy", "true");
          status.textContent = UI.waiting;
          navigator.geolocation.getCurrentPosition(
            ({coords}) => {
              located = true;
              button.disabled = false;
              button.removeAttribute("aria-busy");
              button.textContent = UI.updateLocation;
              clearResults();
              show(coords.latitude, coords.longitude, false);
            },
            (error) => {
              button.disabled = false;
              button.removeAttribute("aria-busy");
              status.textContent = error.code === 1 ? UI.permissionDenied : error.code === 2 ? UI.positionUnavailable : UI.timeout;
            },
            {enableHighAccuracy: false, timeout: 12000, maximumAge: located ? 0 : 300000}
          );
        });
      }
    })();
  </script>
{% endblock %}
