<section id="awards">
  <h2>{{ t("common.awards") }}</h2>
  <ul class="ranking">
    {% for prize, route in prizes %}
    <li>
      <article>
        <div class="award-identity">
          {% if prize.logo %}<img class="award-logo" src="{{ asset_href(prize.logo) }}" alt="{{ t("common.logo_alt", name=term("prize", prize.prize_name)) }}">{% endif %}
        </div>
        <div>
          <h3>
            <a href="{{ href(route) }}">{{ term("prize", prize.prize_name) }}</a>
            <a class="external-link" href="{{ prize.url }}" aria-label="{{ t("common.official_website_aria", name=term("prize", prize.prize_name)) }}" title="{{ t("common.official_website") }}">↗</a>
          </h3>
          <p>{{ ranking_blurb(prize.qid) }}</p>
        </div>
      </article>
    </li>
    {% endfor %}
  </ul>
</section>
