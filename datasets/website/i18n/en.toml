[ranking.Q7191]
blurb = "Established by Alfred Nobel's 1895 will and first awarded in 1901, recognizing major contributions to physics, chemistry, medicine, literature, and peace. Presented every 10 December: the science and literature prizes at the Stockholm Concert Hall in Sweden, the Peace Prize at Oslo City Hall in Norway. Carries a prize of roughly $1.1 million, split among co-recipients."

[ranking.Q28835]
blurb = "An international mathematics award for researchers under 40, first presented in 1936 and funded by a trust John Charles Fields left at the University of Toronto. Awarded every four years by the Berlin-based International Mathematical Union at the International Congress of Mathematicians, whose host city changes each cycle. Carries a prize of roughly $11,000."

[ranking.Q185667]
blurb = "The Association for Computing Machinery's highest award, given since 1966 for contributions of lasting importance to computing. Awarded annually and presented each June at the ACM Awards Banquet in the United States. Carries a prize of $1 million, funded by Google."

[ranking.Q317038]
blurb = "The German Physical Society's highest honor, endowed in 1929 for Max Planck's 70th birthday, for outstanding achievement in theoretical physics. Awarded annually by the society, which is based at Bad Honnef near Bonn, and presented at its spring meeting in a rotating German host city. Carries no cash prize."

[ranking.Q188184]
blurb = "Established by the Norwegian government in 2002 and first awarded in 2003 for outstanding scientific work in mathematics. Awarded annually by the Norwegian Academy of Science and Letters, with the ceremony held each spring in Oslo, Norway. Carries a prize of roughly $700,000."

[ranking.Q921415]
blurb = "Founded in 1945 by Albert and Mary Lasker, covering basic medical research, clinical medical research, public service, and special achievement in medical science. Awarded annually, with the ceremony held each September in New York City. Carries a prize of $250,000 per category."

[ranking.Q1031994]
blurb = "Given since 1959 by the Gairdner Foundation, established in 1957, for biomedical research that advances understanding of human biology and disease. Five awards are presented annually in Toronto, Canada. Carries a prize of roughly $75,000 per laureate."

[ranking.Q739936]
blurb = "Established by the Wolf Foundation in 1975 and first awarded in 1978 in agriculture, chemistry, mathematics, medicine, physics, and the arts. Awarded annually, with the ceremony held in Jerusalem, Israel. Carries a prize of $100,000 per category, split among co-recipients."

[ranking.Q658444]
blurb = "Created by the Inamori Foundation in 1984 and first awarded in 1985 in three categories: advanced technology, basic sciences, and arts and philosophy. Three prizes are presented each November in Kyoto, Japan. Carries a prize of roughly $650,000 per category."

[ranking.Q583069]
blurb = "Established in 1980 and first awarded in 1982 to cover sciences outside the original Nobel categories, rotating through astronomy, mathematics, geosciences, biosciences, and polyarthritis research. Presented annually each spring in Stockholm by the Royal Swedish Academy of Sciences. Carries a prize of roughly $600,000."

[ranking.Q18357422]
blurb = "An international neuroscience award founded by the Lundbeck Foundation in 2011. Presented annually in Denmark, it recognizes one or more active researchers for outstanding contributions to neuroscience. Carries DKK 10 million, shared among the recipients."

[ranking.Q584250]
blurb = "Established in Hong Kong by Run Run Shaw in 2002 and first awarded in 2004 in astronomy, life science and medicine, and mathematical sciences. Three prizes are presented annually at a ceremony in Hong Kong. Carries a prize of $1.2 million per category."

[ranking.Q1094530]
blurb = "First awarded in 2008 for breakthroughs in astrophysics, nanoscience, and neuroscience. Three prizes are presented every two years at a ceremony in Oslo, Norway. Carries a prize of $1 million per field, split among co-recipients."

[ranking.Q908745]
blurb = "Awarded since 1985 by the Japan Prize Foundation in two rotating areas each year, one drawn from physics, chemistry, informatics, and engineering, the other from life science, agriculture, medicine, and pharmacy. Presented each April in Tokyo, Japan. Carries a prize of roughly $330,000 per category."

[ranking.Q1853663]
blurb = "First awarded in 2004 for technological innovations that improve quality of life and sustainable development. Governed by Technology Academy Finland, the biennial prize is presented in Helsinki under the patronage of the President of Finland. Carries a prize of €1 million."

[ranking.Q17278140]
blurb = "Founded in 2012 by a group of technology entrepreneurs to reward achievements in fundamental physics, life sciences, and mathematics. Awarded annually at a televised ceremony in the Los Angeles area of California. Carries a prize of $3 million per award, the largest of any prize on this site."
