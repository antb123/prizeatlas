"about.actions_countries_end" = "— les universités, laboratoires et organisations associés aux lauréats."
"about.actions_countries_start" = "— les lauréats par pays de naissance, d'affiliation lors du prix ou de décès ; et"
"about.actions_explorer" = "– classements, graphiques et comparaisons entre pays, prix et personnes."
"about.actions_heading" = "Ce que vous pouvez faire ici"
"about.actions_map" = "— un atlas interactif des lieux de naissance enregistrés et des institutions récompensées."
"about.actions_people" = "— chaque récipiendaire enregistré, classé par nom de famille, avec ses différents prix rassemblés en un seul endroit."
"about.actions_prizes" = "- les familles de prix, leurs catégories et années d'attribution, ainsi qu'une page pour chaque récipiendaire avec la citation complète."
"about.actions_subjects" = "— les prix par matière scolaire et les établissements présents dans chaque domaine."
"about.atlas" = "L'atlas"
"about.contact_us" = "Contactez-nous"
"about.countries" = "Pays"
"about.data_heading" = "Données et sources"
"about.data_pages" = "Les pages sont générées depuis la base de données et servies comme fichiers statiques. Les visites ne sont pas enregistrées. L'explorateur peut demander votre pays à un service public ; un échec n'affecte pas le reste de la page."
"about.data_records" = "Une ligne par lauréat, issue des sources officielles et recoupée avec Wikipédia et Wikidata. Les établissements sont identifiés via Wikidata, ROR et OpenAlex ; les chercheurs via ORCID lorsqu'il existe. Chaque donnée est vérifiée ; les incertitudes restent vides. Les lieux portent leur nom actuel : Königsberg figure sous Kaliningrad, Russie."
"about.design_aim" = "Nous espérons que, dans un siècle, certains de ces lauréats resteront aussi connus qu'Einstein. Le choix des prix mise sur cet impact durable, que seuls quelques lauréats atteindront."
"about.design_geography" = "La carte compare lieux de naissance et établissements, par matière. La page « À proximité » affiche ceux qui sont les plus proches de vous."
"about.design_heading" = "Principes de conception"
"about.design_humanity" = "Nous pensons que beaucoup de ces personnes enrichissent le savoir de l'humanité et améliorent sa qualité de vie pour l'avenir. Elles méritent d'être célébrées non seulement comme des héros nationaux, mais comme des citoyens du monde au service de l'humanité. Nous avons laissé de côté les prix Nobel de littérature, de la paix et de sciences économiques, ainsi que les autres prix artistiques, uniquement pour garder la collection centrée sur les sciences et les mathématiques, et non parce que ces prix vaudraient moins."
"about.design_laureate" = "Chaque page mène aux explications de ChatGPT, Perplexity, Brave et Wikipédia, ainsi qu'aux publications dans OpenAlex lorsqu'elles existent. Les établissements proposent aussi leur lien d'admission lorsqu'il est disponible."
"about.design_license_end" = " (sans version), sans sections invariantes ni textes de couverture. Le code relève de la GNU GPL, version 2 ou ultérieure. Les références renvoient aux sources officielles, à Wikidata, Wikipédia, ROR et OpenAlex."
"about.design_license_middle" = "et la"
"about.design_license_start" = "Les données et contenus originaux sont proposés sous deux licences :"
"about.design_mobile" = "Le site est conçu pour bien fonctionner sur un petit écran et une connexion lente."
"about.design_subjects" = "Le site s'adresse aux élèves et étudiants en sciences et mathématiques, avec un accès par matière scolaire. La collection reste centrée sur ces domaines."
