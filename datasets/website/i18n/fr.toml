[ranking]

[ranking.Q1031994]
blurb = "Décerné depuis 1959 par la Fondation Gairdner, créée en 1957, pour la recherche biomédicale qui fait progresser la compréhension de la biologie humaine et des maladies. Cinq prix sont décernés chaque année à Toronto, au Canada. Dotation : environ 75 000 $ par lauréat."

[ranking.Q1094530]
blurb = "Décerné pour la première fois en 2008 pour des percées en astrophysique, nanosciences et neurosciences. Trois prix sont décernés tous les deux ans lors d'une cérémonie à Oslo, en Norvège. Dotation : 1 million de dollars par domaine, à partager entre les lauréats."

[ranking.Q17278140]
blurb = "Créé en 2012 par un groupe d'entrepreneurs technologiques pour récompenser les réalisations en physique fondamentale, en sciences de la vie et en mathématiques. Décerné chaque année lors d'une cérémonie télévisée dans la région de Los Angeles en Californie. Dotation : 3 millions de dollars par prix, le montant le plus élevé sur ce site."

[ranking.Q18357422]
blurb = "Prix international créé par la Fondation Lundbeck en 2011. Remis chaque année au Danemark à un ou plusieurs chercheurs en activité pour leurs contributions majeures aux neurosciences. Dotation : 10 millions de couronnes danoises, partagées entre les lauréats."

[ranking.Q1853663]
blurb = "Décerné pour la première fois en 2004 pour les innovations technologiques qui améliorent la qualité de vie et le développement durable. Géré par la Technology Academy Finland, le prix biennal est décerné à Helsinki sous le patronage du président finlandais. Dotation : 1 million d'euros."

[ranking.Q185667]
blurb = "La plus haute distinction décernée par l'Association for Computing Machinery, décernée depuis 1966 pour des contributions d'une importance durable à l'informatique. Décerné chaque année et présenté chaque année en juin lors du banquet des ACM Awards aux États-Unis. Dotation : un million de dollars, financée par Google."

[ranking.Q188184]
blurb = "Créé par le gouvernement norvégien en 2002 et décerné pour la première fois en 2003 pour des travaux scientifiques exceptionnels en mathématiques. Décerné chaque année par l'Académie norvégienne des sciences et des lettres, la cérémonie ayant lieu chaque printemps à Oslo, en Norvège. Dotation : environ 700 000 $."

[ranking.Q28835]
blurb = "Un prix international de mathématiques destiné aux chercheurs de moins de 40 ans, décerné pour la première fois en 1936 et financé par une fiducie laissée par John Charles Fields à l'Université de Toronto. Décerné tous les quatre ans par l'Union mathématique internationale basée à Berlin lors du Congrès international des mathématiciens, dont la ville hôte change à chaque cycle. Dotation : environ 11 000 $."

[ranking.Q317038]
blurb = "La plus haute distinction de la Société allemande de physique, décernée en 1929 à l'occasion du 70e anniversaire de Max Planck, pour ses réalisations exceptionnelles en physique théorique. Décerné chaque année par la société basée à Bad Honnef, près de Bonn, et présenté lors de sa réunion de printemps dans une ville hôte allemande en rotation. Ne comporte aucun prix en espèces."

[ranking.Q583069]
blurb = "Créé en 1980, décerné depuis 1982 dans des sciences hors des catégories Nobel originales : astronomie, mathématiques, géosciences, biosciences et recherche sur la polyarthrite, en alternance. Remis chaque printemps à Stockholm par l'Académie royale des sciences de Suède. Dotation : environ 600 000 dollars."

[ranking.Q584250]
blurb = "Créé à Hong Kong par Run Run Shaw en 2002 et décerné pour la première fois en 2004 en astronomie, sciences de la vie, médecine et sciences mathématiques. Trois prix sont décernés chaque année lors d'une cérémonie à Hong Kong. Dotation : 1,2 million de dollars par catégorie."

[ranking.Q658444]
blurb = "Créé par la Fondation Inamori en 1984 et décerné pour la première fois en 1985 dans trois catégories : technologie avancée, sciences fondamentales, arts et philosophie. Trois prix sont décernés chaque novembre à Kyoto, au Japon. Dotation : environ 650 000 $ par catégorie."

[ranking.Q7191]
blurb = "Physique, chimie et physiologie ou médecine uniquement : les prix scientifiques créés par le testament d'Alfred Nobel en 1895 et décernés pour la première fois en 1901. Les prix de littérature, de la paix et de sciences économiques ne sont pas couverts. Remis chaque 10 décembre au Stockholm Concert Hall en Suède ; environ 1,1 million de dollars, répartis entre les co-lauréats."

[ranking.Q739936]
blurb = "Créé par la Fondation Wolf en 1975 et décerné pour la première fois en 1978 dans les domaines de l'agriculture, de la chimie, des mathématiques, de la médecine, de la physique et des arts. Décerné chaque année, lors d'une cérémonie organisée à Jérusalem, en Israël. Dotation : 100 000 $ par catégorie, à partager entre les lauréats."

[ranking.Q908745]
blurb = "Décerné depuis 1985 par la Japan Prize Foundation dans deux domaines qui changent chaque année, l'un tiré de la physique, de la chimie, de l'informatique et de l'ingénierie, l'autre des sciences de la vie, de l'agriculture, de la médecine et de la pharmacie. Présenté chaque avril à Tokyo, au Japon. Dotation : environ 330 000 $ par catégorie."

[ranking.Q921415]
blurb = "Créé en 1945 par Albert et Mary Lasker pour la recherche médicale fondamentale et clinique, le service public et les réalisations exceptionnelles en médecine. Remis chaque septembre à New York. Dotation : 250 000 dollars par catégorie."
