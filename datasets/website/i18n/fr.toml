[ranking]

[ranking.Q1031994]
blurb = "Donné depuis 1959 par la Fondation Gairdner, créée en 1957, pour la recherche biomédicale qui fait progresser la compréhension de la biologie humaine et des maladies. Cinq prix sont décernés chaque année à Toronto, au Canada. Porte un prix d'environ 75 000 $ par lauréat."

[ranking.Q1094530]
blurb = "Décerné pour la première fois en 2008 pour des percées en astrophysique, nanosciences et neurosciences. Trois prix sont décernés tous les deux ans lors d'une cérémonie à Oslo, en Norvège. Porte un prix de 1 million de dollars par domaine, réparti entre les co-récipiendaires."

[ranking.Q17278140]
blurb = "Fondée en 2012 par un groupe d'entrepreneurs technologiques pour récompenser les réalisations en physique fondamentale, en sciences de la vie et en mathématiques. Décerné chaque année lors d'une cérémonie télévisée dans la région de Los Angeles en Californie. Porte un prix de 3 millions de dollars par récompense, le plus gros de tous les prix sur ce site."

[ranking.Q18357422]
blurb = "Prix international des neurosciences fondé par la Fondation Lundbeck en 2011. Présenté chaque année au Danemark, il récompense un ou plusieurs chercheurs actifs pour leurs contributions exceptionnelles aux neurosciences. Transporte 10 millions DKK, partagés entre les bénéficiaires."

[ranking.Q1853663]
blurb = "Décerné pour la première fois en 2004 pour les innovations technologiques qui améliorent la qualité de vie et le développement durable. Géré par la Technology Academy Finland, le prix biennal est décerné à Helsinki sous le patronage du président finlandais. Porte un prix de 1 million d'euros."

[ranking.Q185667]
blurb = "La plus haute distinction décernée par l'Association for Computing Machinery, décernée depuis 1966 pour des contributions d'une importance durable à l'informatique. Décerné chaque année et présenté chaque année en juin lors du banquet des ACM Awards aux États-Unis. Porte un prix d'un million de dollars, financé par Google."

[ranking.Q188184]
blurb = "Créé par le gouvernement norvégien en 2002 et récompensé pour la première fois en 2003 pour des travaux scientifiques exceptionnels en mathématiques. Décerné chaque année par l'Académie norvégienne des sciences et des lettres, la cérémonie ayant lieu chaque printemps à Oslo, en Norvège. Porte un prix d'environ 700 000 $."

[ranking.Q28835]
blurb = "Un prix international de mathématiques destiné aux chercheurs de moins de 40 ans, décerné pour la première fois en 1936 et financé par une fiducie laissée par John Charles Fields à l'Université de Toronto. Décerné tous les quatre ans par l'Union mathématique internationale basée à Berlin lors du Congrès international des mathématiciens, dont la ville hôte change à chaque cycle. Porte un prix d'environ 11 000 $."

[ranking.Q317038]
blurb = "La plus haute distinction de la Société allemande de physique, décernée en 1929 à l'occasion du 70e anniversaire de Max Planck, pour ses réalisations exceptionnelles en physique théorique. Décerné chaque année par la société basée à Bad Honnef, près de Bonn, et présenté lors de sa réunion de printemps dans une ville hôte allemande en rotation. Ne comporte aucun prix en espèces."

[ranking.Q583069]
blurb = "Créé en 1980 et décerné pour la première fois en 1982 pour couvrir les sciences en dehors des catégories Nobel originales, en alternance avec l'astronomie, les mathématiques, les géosciences, les biosciences et la recherche sur la polyarthrite. Présenté chaque année chaque printemps à Stockholm par l'Académie royale des sciences de Suède. Porte un prix d'environ 600 000 $."

[ranking.Q584250]
blurb = "Créé à Hong Kong par Run Run Shaw en 2002 et récompensé pour la première fois en 2004 en astronomie, sciences de la vie, médecine et sciences mathématiques. Trois prix sont décernés chaque année lors d'une cérémonie à Hong Kong. Porte un prix de 1,2 million de dollars par catégorie."

[ranking.Q658444]
blurb = "Créée par la Fondation Inamori en 1984 et récompensée pour la première fois en 1985 dans trois catégories : technologie avancée, sciences fondamentales, arts et philosophie. Trois prix sont décernés chaque novembre à Kyoto, au Japon. Porte un prix d'environ 650 000 $ par catégorie."

[ranking.Q7191]
blurb = "Créé par le testament d'Alfred Nobel en 1895 et décerné pour la première fois en 1901, en reconnaissance de contributions majeures à la physique, à la chimie, à la médecine, à la littérature et à la paix. Remis tous les 10 décembre : les prix scientifiques et littéraires au Stockholm Concert Hall en Suède, le Prix de la Paix à l'Hôtel de Ville d'Oslo en Norvège. Le prix est d'environ 1,1 million de dollars, réparti entre les co-récipiendaires."

[ranking.Q739936]
blurb = "Créée par la Fondation Wolf en 1975 et décernée pour la première fois en 1978 dans les domaines de l'agriculture, de la chimie, des mathématiques, de la médecine, de la physique et des arts. Décerné chaque année, lors d'une cérémonie organisée à Jérusalem, en Israël. Porte un prix de 100 000 $ par catégorie, réparti entre les co-récipiendaires."

[ranking.Q908745]
blurb = "Décerné depuis 1985 par la Japan Prize Foundation dans deux domaines tournants chaque année, l'un tiré de la physique, de la chimie, de l'informatique et de l'ingénierie, l'autre des sciences de la vie, de l'agriculture, de la médecine et de la pharmacie. Présenté chaque avril à Tokyo, au Japon. Porte un prix d'environ 330 000 $ par catégorie."

[ranking.Q921415]
blurb = "Fondée en 1945 par Albert et Mary Lasker, elle couvre la recherche médicale fondamentale, la recherche médicale clinique, la fonction publique et les réalisations particulières en sciences médicales. Décerné chaque année, la cérémonie ayant lieu chaque mois de septembre à New York. Porte un prix de 250 000 $ par catégorie."
