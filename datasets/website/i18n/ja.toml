"about.actions_people" = "— 記録にあるすべての受賞者を姓順にリストします。個人のページにはすべての賞が 1 か所に集められており、そこで繰り返しの受賞者が明らかになります。"
"about.actions_prizes" = "— 各賞ファミリーには、短い説明と編集上の威信スコアが記載されており、その賞のカテゴリー、受賞年、および完全な引用を含むすべての受賞者のページが始まります。"
"about.actions_subjects" = "— 同じ賞が高校のクラスごとに再編成され、機関が各分野で繰り返し開催されます。"
"about.atlas" = "アトラス"
"about.contact_us" = "お問い合わせ"
"about.countries" = "国"
"about.data_heading" = "データの出所"
"about.data_pages" = "ページ自体はビルド スクリプトによってデータベースから生成され、固定ファイルとして提供されます。あなたが読んでいる間に何も組み立てられず、あなたの訪問について何も記録されません。唯一の例外はエクスプローラーです。エクスプローラーは、自国の受賞者を最初に示すために、どの国から閲覧しているかを公共サービスに尋ねることがあります。そのリクエストが失敗しても、ページの残りの部分は影響を受けません。"
"about.data_records" = "受賞者ごとに 1 行。各賞の公式記録から編集され、Wikipedia および Wikidata と照合されます。機関はウィキデータのエントリから除外され、研究組織レジストリ (ROR) および OpenAlex と照合されて、名前が特定の場所に解決され、その組織自体の記録にリンクされます。また、受賞者は、ORCID 識別子が存在する場合にはその識別子にリンクされます。フィールドは卸売でインポートされるのではなく個別に検証され、セルは推測ではなく空白のままにするのが原則です。ここで出生地が欠落しているということは、誰もそれを確認できなかったことを意味し、それがもっともらしいものに四捨五入されたということではありません。地名は現在の名前を使用しているため、1904 年にケーニヒスベルクで生まれた受賞者は、ロシアのカリーニングラードの下にリストされています。"
"about.design_aim" = "より長期的な目標は、今から 1 世紀後も、今日の勝者の多くがアインシュタインと同じように記憶されている場所を作ることです。ほとんどの賞品では、これに到達するのはほんの一握りであるため、賞品リスト自体は、すべての勝者が継続することを期待するのではなく、べき乗則の賭けを念頭に置いて選択されています。"
"about.design_geography" = "地図と近くのページは、同じデータを地理に変換します。この地図には、受賞者が後に勤務した機関と出生地がプロットされており、テーマごとにフィルタリングできるため、読者は一度に 1 つの地域または 1 つの分野を詳しく調べることができます。 Nearby は、読者が実際にどこにいても同じことを行い、その位置情報を使用して最も近い受賞者の出生地や機関を表示します。"
"about.design_heading" = "設計思想"
"about.design_humanity" = "私たちは、これらの人々の多くが人類についての知識を増やし、今後の人類の生活の質を促進していると考えています。これらの人々は国の英雄としてだけでなく、人類を促進した地球市民としても大切にされるべきです。プロセスを簡素化するためにノーベル文学賞やその他の芸術賞を削除しただけであり、これらの他の賞が決して劣っているわけではありません。"
"about.design_laureate" = "受賞者のページは終わりではなく始まりであることを意図しています。引用に加えて、各賞は ChatGPT、Perplexity、Brave、Wikipedia へのリンクになっており、賞はすでに質問として構成されているため、要約だけではなくもっと知りたい読者はワンクリックでアクセスできます。受賞者の OpenAlex 記録が存在する場合は、そのページにもリンクが張られています。平易な言葉での説明から、その人が実際に書いた特定の論文に至るまでの軌跡がここにあります。読者がその主題に初めて会う場合でも、すでに文献を読んでいる場合でも、同じサイトが機能します。教育機関のページでは、別の質問についても同様のことが行われます。所属機関が申請方法を公開している場合は、次にどこで勉強するかを検討している人のために、そのリンクもここにあります。"
"about.design_license_end" = "(バージョン化されていない)、不変セクションやカバーセクションはありません。ソース コードは、GNU General Public License バージョン 2 以降に基づいてライセンスされています。全体の参照は、授与機関自身の記録、ウィキデータ、ウィキペディア、研究組織レジストリ (ROR)、および OpenAlex などの情報源を示しているため、ここでの事実はいつでもその出所を追跡できます。"
"about.design_license_middle" = "そして"
"about.design_license_start" = "厳選されたデータとオリジナルのサイト コンテンツは、以下の二重ライセンスを受けています。"
"about.design_mobile" = "このサイトは、まず接続が遅い携帯電話で動作し、次にデスクトップで動作するように構築されています。その逆ではありません。つまり、プレーン HTML、小さなページ、フレームワークがないため、信号バーが 1 本の学校の Chromebook や、帯域幅が高価な市場のブラウザに負担がかかりません。目標はどのデバイスでも同じです。無料、高速、有益であり、読者と答えの間に何も立ちはだかるものはありません。"
"about.design_subjects" = "このサイトは主に科学と数学の学生向けに構築されているため、高校の科目 (生物学、化学、物理学、数学など) ごとにすべてを検索することもできます。私たちは誰よりも文学と芸術が好きですが、初期の段階で、すべての分野を一度にカバーしようとするのではなく、このコレクションに焦点を当て続けることにしました。"
