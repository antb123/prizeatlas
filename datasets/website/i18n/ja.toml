"about.prizes_contact_or" = "または"
"about.prizes_contact_start" = "賞品がこれらのバーの 1 つをクリアしていて、まだ到着していない場合は、プル リクエストを送信するか、問題をオープンして追加します。"
"about.prizes_criteria" = "受賞者が特定の国ではなく世界中から選ばれたこと、25 年以上の歴史、または 100 万ドルを超える財布など、3 つのバーのうち少なくとも 1 つをクリアした場合に賞金が与えられます。 1 つの基準を満たすだけで十分です。ブレークスルー賞は 14 歳で賞金のみで資格を取得し、ショー賞は 22 歳で同様に、アーベル賞は 23 歳で国際受賞者リストに登録されます。リストにある他のものはすべて年齢制限を完全にクリアしており、中には 100 歳以上のものもあります。"
"about.prizes_heading" = "どの賞品がリストに入るのか"
"about.prizes_list_end" = "。ここにすべてが掲載されているわけではありません。EMBO の賞はヨーロッパのみに授与され、ホルバーグ賞とバルザン賞は特に科学賞ではありません。"
"about.prizes_list_start" = "私たちがリストを作成する際に役立つと感じたリストの 1 つは、欧州研究評議会による次のリストです。"
"about.scientific_prizes" = "科学賞"
"about.students_data" = "受賞者と国をランク付けし、読者がそのランキングをテストできるようにします。人口で割るとリーダーボードが完全に変わり、その理由に気づくことができます。"
"about.students_data_title" = "データを読み取る練習をします。"
"about.students_fast" = "これらはプレーンな HTML ページです。アカウントもペイウォールもクッキーバナーも自動再生も何もありません。学校の Chromebook や、信号バーが 1 つある携帯電話でも開きます。"
"about.students_fast_title" = "どこでも高速かつ無料。"
"about.students_geography" = "受賞者が生まれた場所と、彼らが後に働いた機関とを対立させるプロット。 2 つの点の間の距離は、1 世紀にわたる移住に相当し、一目でわかります。"
"about.students_geography_title" = "地理と歴史を一度に表示。"
