"about.intro" = "永続的な影響を与える作品を示す国際的な賞と、それを受賞したすべての人への、無料で静的な参照。すべての賞、すべての受賞年、すべての受賞者には独自のページがあり、ページは主題、国、機関ごとに相互にリンクされているため、ある名前が次の名前につながるようになります。"
