[ranking]

[ranking.Q1031994]
blurb = "人間の生物学と病気の理解を進める生物医学研究を目的として、1957 年に設立されたガードナー財団によって 1959 年から与えられています。カナダのトロントでは、毎年 5 つの賞が授与されます。受賞者1人当たりの賞金は約7万5000ドル。"

[ranking.Q1094530]
blurb = "天体物理学、ナノサイエンス、神経科学の画期的な進歩に対して 2008 年に初めて授与されました。ノルウェーのオスロで開催される式典では、2 年ごとに 3 つの賞が授与されます。分野ごとに 100 万ドルの賞金が贈られ、共同受賞者間で分配されます。"

[ranking.Q17278140]
blurb = "基礎物理学、生命科学、数学の業績を表彰するためにテクノロジー起業家のグループによって 2012 年に設立されました。カリフォルニア州ロサンゼルス地域でテレビ放映される授賞式で毎年授与されます。賞金は 1 件につき 300 万ドルで、このサイトの賞金の中で最高額です。"

[ranking.Q18357422]
blurb = "ルンドベック財団によって 2011 年に設立された国際的な神経科学賞。毎年デンマークで授与され、神経科学への顕著な貢献を果たした 1 名以上の現役研究者を表彰します。 1,000万デンマーククローネを運び、受取人の間で分け合います。"

[ranking.Q1853663]
blurb = "生活の質と持続可能な開発を向上させる技術革新に対して 2004 年に初めて授与されました。この賞はテクノロジー・アカデミー・フィンランドが管理し、フィンランド大統領の後援の下、ヘルシンキで隔年で授与されます。賞金は100万ユーロ。"

[ranking.Q185667]
blurb = "Association for Computing Machinery の最高賞。コンピューティングにとって永続的に重要な貢献に対して 1966 年から授与されています。毎年授与され、毎年 6 月に米国で開催される ACM Awards Banquet で授与されます。 Google が資金提供し、賞金 100 万ドルが贈られます。"

[ranking.Q188184]
blurb = "2002 年にノルウェー政府によって設立され、数学における優れた科学的業績に対して 2003 年に初めて授与されました。ノルウェー科学文学アカデミーによって毎年授与され、授賞式は毎年春にノルウェーのオスロで開催されます。賞金総額は約70万ドル。"

[ranking.Q28835]
blurb = "40 歳未満の研究者を対象とした国際数学賞。1936 年に初めて授与され、ジョン チャールズ フィールズがトロント大学に残した信託によって資金提供されました。ベルリンに本拠を置く国際数学者会議において、国際数学連合によって 4 年ごとに授与され、開催都市は周期ごとに変わります。賞金は約11,000ドル。"

[ranking.Q317038]
blurb = "1929 年のマックス プランクの 70 歳の誕生日に、理論物理学における傑出した業績に対して贈られた、ドイツ物理学会の最高の栄誉。ボン近郊のバート・ホンネフに本拠を置く同協会から毎年授与され、ドイツの開催都市が輪番で開催される春季大会で発表される。賞金はありません。"

[ranking.Q583069]
blurb = "1980年に設立され、1982年に最初の授与が行われ、天文学、数学、地球科学、生物科学、多発性関節炎の研究を通じて、本来のノーベル賞カテゴリー以外の科学をカバーしました。スウェーデン王立科学アカデミーによって毎年春にストックホルムで発表されます。賞金総額は約60万ドル。"

[ranking.Q584250]
blurb = "2002 年に Run Run Shaw によって香港で設立され、2004 年に天文学、生命科学と医学、数理科学の分野で初めて授与されました。香港の授賞式では毎年 3 つの賞が授与されます。部門ごとに賞金 120 万ドルが贈られます。"

[ranking.Q658444]
blurb = "1984年に稲盛財団によって創設され、1985年に先端技術、基礎科学、芸術と哲学の3部門で最初に授与された。毎年 11 月に日本の京都で 3 つの賞が授与されます。賞金は部門ごとに約 65 万ドルです。"

[ranking.Q7191]
blurb = "アルフレッド・ノーベルの 1895 年の遺言によって設立され、物理学、化学、医学、文学、平和への多大な貢献を表彰して 1901 年に初めて授与されました。毎年 12 月 10 日に授与されます。科学賞と文学賞はスウェーデンのストックホルム コンサート ホールで、平和賞はノルウェーのオスロ市庁舎で授与されます。賞金は約 110 万ドルで、共同受賞者の間で分配されます。"

[ranking.Q739936]
blurb = "1975 年にウルフ財団によって設立され、1978 年に農業、化学、数学、医学、物理学、芸術の分野で初めて授与されました。毎年授与され、授賞式はイスラエルのエルサレムで行われます。カテゴリーごとに賞金 100,000 ドルが贈られ、共同受賞者間で分配されます。"

[ranking.Q908745]
blurb = "1985 年以来、日本国際賞財団により、物理学、化学、情報学、工学から選ばれた 2 つの分野と、生命科学、農業、医学、薬学から選ばれた 2 つの分野で毎年交代で授与されています。毎年4月に東京で発表されます。部門ごとに約 33 万ドルの賞金がかけられます。"

[ranking.Q921415]
