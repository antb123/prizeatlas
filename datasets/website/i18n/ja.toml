"about.students_intro" = "賞の引用は、これまでに書かれた発見の最も短い正直な要約です。それぞれが、委員会を通過しなければならなかった文章の中で、何が、誰によって、そしてなぜそれが重要だったのかを述べています。このサイトはそれらを収集し、学生がすでに持っている用語で閲覧できるようにします。"
"about.students_source" = "各ページには正規のアドレスが記載されており、授与団体自身の記録へのリンクがあるため、エッセイや参考文献での引用は検索ではなく、コピー アンド ペーストで行うことができます。"
