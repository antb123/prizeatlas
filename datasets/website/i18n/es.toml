[ranking]

[ranking.Q1031994]
blurb = "Otorgado desde 1959 por la Fundación Gairdner, establecida en 1957, para la investigación biomédica que promueve la comprensión de la biología y las enfermedades humanas. Anualmente se entregan cinco premios en Toronto, Canadá. Dotación: unos 75.000 dólares por ganador."

[ranking.Q1094530]
blurb = "Otorgado por primera vez en 2008 por avances en astrofísica, nanociencia y neurociencia. Cada dos años se entregan tres premios en una ceremonia en Oslo, Noruega. Dotación: 1 millón de dólares por campo, dividido entre los co-receptores."

[ranking.Q17278140]
blurb = "Creado en 2012 por un grupo de emprendedores tecnológicos para recompensar los logros en física fundamental, ciencias biológicas y matemáticas. Otorgado anualmente en una ceremonia televisada en el área de Los Ángeles en California. Dotación: 3 millones de dólares por premio, el mayor de todos los premios en este sitio."

[ranking.Q18357422]
blurb = "Un premio internacional de neurociencia fundado por la Fundación Lundbeck en 2011. Presentado anualmente en Dinamarca, reconoce a uno o más investigadores activos por sus destacadas contribuciones a la neurociencia. Dotación: 10 millones de coronas danesas, repartidas entre los laureados."

[ranking.Q1853663]
blurb = "Otorgado por primera vez en 2004 por innovaciones tecnológicas que mejoran la calidad de vida y el desarrollo sostenible. Gestionado por la Academia de Tecnología de Finlandia, el premio bienal se entrega en Helsinki bajo el patrocinio del Presidente de Finlandia. Dotación: 1 millón de euros."

[ranking.Q185667]
blurb = "El premio más alto de la Association for Computing Machinery, otorgado desde 1966 por contribuciones de importancia duradera a la informática. Otorgado anualmente y presentado cada mes de junio en el Banquete de Premios ACM en los Estados Unidos. Dotación: 1 millón de dólares, financiado por Google."

[ranking.Q188184]
blurb = "Establecido por el gobierno noruego en 2002 y premiado por primera vez en 2003 por su destacado trabajo científico en matemáticas. Otorgado anualmente por la Academia Noruega de Ciencias y Letras, y la ceremonia se lleva a cabo cada primavera en Oslo, Noruega. Dotación: unos 700.000 dólares."

[ranking.Q28835]
blurb = "Un premio internacional de matemáticas para investigadores menores de 40 años, presentado por primera vez en 1936 y financiado por un fideicomiso que John Charles Fields dejó en la Universidad de Toronto. Otorgado cada cuatro años por la Unión Matemática Internacional con sede en Berlín en el Congreso Internacional de Matemáticos, cuya ciudad sede cambia en cada ciclo. Dotación: unos 11.000 dólares."

[ranking.Q317038]
blurb = "El más alto honor de la Sociedad Alemana de Física, otorgado en 1929 con motivo del 70 cumpleaños de Max Planck, por logros sobresalientes en física teórica. Otorgado anualmente por la sociedad, con sede en Bad Honnef, cerca de Bonn, y presentado en su reunión de primavera en una ciudad anfitriona alemana rotativa. No lleva premio en efectivo."

[ranking.Q583069]
blurb = "Establecido en 1980 y otorgado por primera vez en 1982 para cubrir ciencias fuera de las categorías originales del Nobel, rotando entre astronomía, matemáticas, geociencias, biociencias e investigación sobre poliartritis. Presentado anualmente cada primavera en Estocolmo por la Real Academia Sueca de Ciencias. Dotación: unos 600.000 dólares."

[ranking.Q584250]
blurb = "Establecido en Hong Kong por Run Run Shaw en 2002 y premiado por primera vez en 2004 en astronomía, ciencias biológicas y medicina, y ciencias matemáticas. Anualmente se entregan tres premios en una ceremonia en Hong Kong. Dotación: 1,2 millones de dólares por categoría."

[ranking.Q658444]
blurb = "Creado por la Fundación Inamori en 1984 y premiado por primera vez en 1985 en tres categorías: tecnología avanzada, ciencias básicas y artes y filosofía. Cada mes de noviembre se entregan tres premios en Kioto, Japón. Dotación: unos 650.000 dólares por categoría."

[ranking.Q7191]
blurb = "Solo Física, Química y Fisiología o Medicina: los premios científicos creados por el testamento de Alfred Nobel en 1895 y otorgados por primera vez en 1901. Los premios de Literatura, de la Paz y de Ciencias Económicas no están incluidos. Se entregan cada 10 de diciembre en la Sala de Conciertos de Estocolmo, en Suecia; unos 1,1 millones de dólares, repartidos entre los colaureados."

[ranking.Q739936]
blurb = "Establecido por la Fundación Wolf en 1975 y otorgado por primera vez en 1978 en agricultura, química, matemáticas, medicina, física y artes. Otorgado anualmente, con la ceremonia celebrada en Jerusalén, Israel. Dotación: 100.000 dólares por categoría, dividido entre los co-beneficiarios."

[ranking.Q908745]
blurb = "Otorgado desde 1985 por la Fundación del Premio de Japón en dos áreas rotativas cada año: una de física, química, informática e ingeniería; otra de ciencias biológicas, agricultura, medicina y farmacia. Se entrega cada abril en Tokio, Japón. Dotación: unos 330.000 dólares por categoría."

[ranking.Q921415]
blurb = "Creado en 1945 por Albert y Mary Lasker para la investigación médica básica y clínica, el servicio público y los logros especiales en medicina. Se entrega cada septiembre en Nueva York. Dotación: 250.000 dólares por categoría."
