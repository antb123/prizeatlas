[ui]
"about.actions_countries_end" = "— universidades, laboratorios y organizaciones asociadas con los ganadores del premio."
"about.actions_countries_start" = "— laureados por país de nacimiento, de afiliación al recibir el premio o de fallecimiento; e"
"about.actions_explorer" = "— clasificaciones, gráficos y comparaciones entre países, premios y personas."
"about.actions_heading" = "¿Qué puedes hacer aquí?"
"about.actions_map" = "— un atlas interactivo de lugares de nacimiento registrados e instituciones premiadas."
"about.actions_people" = "— todos los laureados registrados, enumerados por apellido, con premios repetidos recopilados en un solo lugar."
"about.actions_prizes" = "— familias de premios, sus categorías y años de premio, y una página para cada laureado con la mención completa."
"about.actions_subjects" = "— premios por materia escolar e instituciones destacadas en cada campo."
"about.atlas" = "el atlas"
"about.contact_us" = "contáctanos"
"about.countries" = "Países"
"about.data_heading" = "Datos y fuentes"
"about.data_pages" = "Las páginas se generan desde la base de datos y se sirven como archivos estáticos. No registramos visitas. El explorador puede consultar un servicio público para detectar tu país; si falla, el resto funciona igual."
"about.data_records" = "Una fila por laureado, basada en fuentes oficiales y contrastada con Wikipedia y Wikidata. Las instituciones se identifican con Wikidata, ROR y OpenAlex; los investigadores, con ORCID cuando existe. Verificamos cada dato y dejamos en blanco lo incierto. Los lugares usan nombres actuales: Königsberg figura como Kaliningrado, Rusia."
"about.design_aim" = "Queremos que dentro de un siglo se recuerde a algunos de estos laureados como hoy se recuerda a Einstein. Seleccionamos los premios pensando en ese impacto duradero, aunque pocos laureados lo alcancen."
"about.design_geography" = "El mapa permite comparar lugares de nacimiento e instituciones por materia. La página «Cerca de ti» muestra los más próximos a tu ubicación."
"about.design_heading" = "Principios de diseño"
"about.design_humanity" = "Creemos que muchas de estas personas amplían el conocimiento de la humanidad y mejoran su calidad de vida para el futuro. Merecen ser apreciadas no solo como héroes nacionales, sino como ciudadanos del mundo al servicio de la humanidad. Dejamos fuera los premios Nobel de Literatura, de la Paz y de Ciencias Económicas, y otros premios artísticos, solo para mantener la colección centrada en ciencia y matemáticas, no porque esos premios valgan menos."
"about.design_laureate" = "Cada página enlaza con explicaciones en ChatGPT, Perplexity, Brave y Wikipedia, y con las publicaciones en OpenAlex cuando existen. Las instituciones incluyen su enlace de admisión cuando está disponible."
"about.design_license_end" = " (sin versión), sin secciones invariantes ni textos de cubierta. El código usa GNU GPL, versión 2 o posterior. Las referencias enlazan con las fuentes oficiales, Wikidata, Wikipedia, ROR y OpenAlex."
"about.design_license_middle" = "y"
"about.design_license_start" = "Los datos y contenidos originales se ofrecen bajo dos licencias:"
"about.design_mobile" = "El sitio está diseñado para funcionar bien en una pantalla pequeña y una conexión lenta."
"about.design_subjects" = "El sitio se dirige a estudiantes de ciencias y matemáticas, con navegación por materia escolar. La selección se centra en esos campos."
