# One row per event. date is YYYY-MM-DD, or YYYY-MM when only the month is known.
# kind: announced | ceremony | both.  status: confirmed | projected.
# 2027 rows are projected as the 2026 date + 364 days (same weekday) unless the prize has published its own date.
# Checked 20261006. Sources: each prize's official site, see award_ranking.url.

[year."2026"]
title = "Award Calendar 2026: When the Nobel, Fields, Turing and Other Major Prizes Are Announced"
heading = "Award calendar 2026"
description = "2026 prize calendar: the dates the Nobel Prize, Fields Medal, Turing Award, Abel Prize, Lasker, Kyoto and 10 more major prizes announce winners and hold ceremonies."
intro = "A month-by-month calendar of when 16 major science and ideas prizes name their winners and when they present them. Winners are announced in one month and honoured at a ceremony in another, so each prize appears twice. Dates come from the prizes' own announcements."

[year."2027"]
title = "Award Calendar 2027 (Draft): Projected Dates for the Nobel, Turing, Abel and Other Major Prizes"
heading = "Award calendar 2027 (draft)"
description = "2027 prize calendar, draft: projected announcement and ceremony dates for the Nobel Prize, Turing Award, Abel Prize, Lasker, Kyoto and other major prizes."
intro = "A draft calendar of when 16 major science and ideas prizes will name and present their winners in 2027. Most dates are projected: the 2026 date moved 52 weeks forward to the same weekday. Dashed dates are projections; solid dates are published by the prize. Where only the month is known, the event sits under that month as TBC."

